[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "twitch-chat-downloader"
version = "1.0.0"
description = "Twitch VOD/Clip Chat Downloader - Python replacement for TwitchDownloader chat functionality + Discord Bot"
authors = [
    {name = "Twitch Chat Downloader Python"}
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "discord.py>=2.3.0",
]

[project.optional-dependencies]
tracker = [
    "seleniumbase>=4.0.0",
]

[project.scripts]
twitch-chat-downloader = "twitch_chat_downloader.cli:app"

[tool.setuptools.packages.find]
include = ["twitch_chat_downloader*"]
